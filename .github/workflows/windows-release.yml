name: Build and release Windows apps

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Test and build Windows x64
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Record build identity
        id: metadata
        shell: pwsh
        run: |
          $short = $env:GITHUB_SHA.Substring(0, 7)
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "build-$env:GITHUB_RUN_NUMBER-$short"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          @"
          """Generated by the Windows release workflow."""
          BUILD_TAG = "$tag"
          BUILD_COMMIT = "$env:GITHUB_SHA"
          GITHUB_REPOSITORY = "$env:GITHUB_REPOSITORY"
          "@ | Set-Content -LiteralPath inventory/_build.py -Encoding utf8

      - name: Install build dependencies
        run: python -m pip install --requirement requirements-build.txt

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Build Implant Inventory
        run: python -m PyInstaller --noconfirm --clean ImplantInventory.spec

      - name: Build Inventory Server
        run: python -m PyInstaller --noconfirm --clean InventoryServer.spec

      - name: Add installers and verify build output
        shell: pwsh
        run: |
          Copy-Item -LiteralPath Update.ps1, INSTALL.cmd -Destination dist\ImplantInventory
          $Required = @(
            'dist\ImplantInventory\ImplantInventory.exe',
            'dist\ImplantInventory\_internal',
            'dist\ImplantInventory\Update.ps1',
            'dist\ImplantInventory\INSTALL.cmd',
            'dist\InventoryServer\InventoryServer.exe',
            'dist\InventoryServer\_internal'
          )
          foreach ($Path in $Required) {
            if (-not (Test-Path -LiteralPath $Path)) {
              throw "Required build output is missing: $Path"
            }
          }

      - name: Package applications and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release, HostPackage\dist -Force | Out-Null
          Compress-Archive -Path dist\ImplantInventory\* -DestinationPath release\ImplantInventory-Windows.zip -CompressionLevel Optimal
          Copy-Item -LiteralPath dist\InventoryServer -Destination HostPackage\dist -Recurse
          Copy-Item -LiteralPath SETUP_HOST.cmd, setup_host.ps1 -Destination HostPackage
          Compress-Archive -Path HostPackage\* -DestinationPath release\InventoryServer-Windows.zip -CompressionLevel Optimal

          $Lines = Get-ChildItem release\*.zip | Sort-Object Name | ForEach-Object {
            $Hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$Hash  $($_.Name)"
          }
          Set-Content -LiteralPath release\SHA256SUMS.txt -Value $Lines -Encoding ascii

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: implant-inventory-windows-${{ github.sha }}
          path: |
            release/ImplantInventory-Windows.zip
            release/InventoryServer-Windows.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          name: implant-inventory-windows-${{ github.sha }}
          path: release

      - name: Choose release metadata
        id: metadata
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          short_sha="${COMMIT_SHA:0:7}"
          if [[ "$REF_TYPE" == "tag" ]]; then
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "name=Implant Inventory $REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-${RUN_NUMBER}-${short_sha}" >> "$GITHUB_OUTPUT"
            echo "name=Implant Inventory build #${RUN_NUMBER} (${short_sha})" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release with both applications
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.metadata.outputs.name }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            release/ImplantInventory-Windows.zip
            release/InventoryServer-Windows.zip
            release/SHA256SUMS.txt
